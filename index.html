<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Motor Market</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#f5f5f5;
}

header{
  background:#d32f2f;
  color:white;
  text-align:center;
  padding:20px;
  font-size:22px;
}

.container{
  display:grid;
  gap:15px;
  padding:10px;
}

.card{
  background:white;
  border-radius:15px;
  padding:10px;
  box-shadow:0 2px 10px #ccc;
}

.card img{
  width:100%;
  border-radius:10px;
}

.price{
  color:green;
  font-weight:bold;
}

input{
  width:90%;
  padding:10px;
  margin:5px;
}

button{
  width:95%;
  padding:10px;
  background:#d32f2f;
  color:white;
  border:none;
  border-radius:10px;
}

a{
  display:inline-block;
  margin-top:5px;
  color:blue;
  text-decoration:none;
}

.delete{
  background:black;
  color:white;
  padding:5px;
  border-radius:5px;
  margin-top:5px;
}
</style>

</head>

<body>

<header>🚗 Motor Market</header>

<input id="search" placeholder="🔍 جستجو موتر..." onkeyup="searchCar()">

<div class="container" id="list"></div>

<h3 style="padding:10px;">➕ ثبت موتر</h3>

<input id="name" placeholder="نام موتر">
<input id="price" placeholder="قیمت">
<input id="image" placeholder="لینک عکس">

<button onclick="addCar()">ثبت</button>

<script>

window.onload = function(){
  let data = JSON.parse(localStorage.getItem("cars")) || [];
  data.forEach(car => showCar(car));
};

function addCar(){
  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;
  let image = document.getElementById("image").value;

  let car = {name, price, image};

  let data = JSON.parse(localStorage.getItem("cars")) || [];
  data.push(car);
  localStorage.setItem("cars", JSON.stringify(data));

  showCar(car);
}

function showCar(car){
  let box = document.createElement("div");
  box.className = "card";

  box.innerHTML = `
    <img src="${car.image}">
    <h3>${car.name}</h3>
    <p class="price">${car.price} افغانی</p>
    <a href="https://wa.me/93700000000" target="_blank">📞 واتساپ</a>
    <br>
    <button class="delete" onclick="deleteCar(this)">حذف</button>
  `;

  document.getElementById("list").appendChild(box);
}

function deleteCar(btn){
  btn.parentElement.remove();

  let data = JSON.parse(localStorage.getItem("cars")) || [];
  data.pop();
  localStorage.setItem("cars", JSON.stringify(data));
}

function searchCar(){
  let input = document.getElementById("search").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for(let i=0;i<cards.length;i++){
    let text = cards[i].innerText.toLowerCase();
    if(text.includes(input)){
      cards[i].style.display = "block";
    }else{
      cards[i].style.display = "none";
    }
  }
}

</script>

</body>
</html>
