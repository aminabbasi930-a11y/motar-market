
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Motor Market</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f2f2f2;
}

header {
  background: #d32f2f;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  padding: 10px;
}

.card {
  background: white;
  padding: 10px;
  margin: 10px;
  border-radius: 10px;
}

button {
  background: #d32f2f;
  color: white;
  padding: 10px;
  border: none;
  width: 100%;
  margin-top: 5px;
}
</style>
</head>

<body>

<header>
🚗 Motor Market
</header>

<div class="container" id="list">

<div class="card">
<h3>Corolla 2010</h3>
<p>500,000 افغانی</p>
</div>

</div>

<h3 style="padding:10px;">➕ اضافه کردن موتر</h3>

<input id="name" placeholder="نام موتر"><br><br>
<input id="price" placeholder="قیمت"><br><br>

<button onclick="addCar()">ثبت</button>

<script>
function addCar() {
  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;

  let box = document.createElement("div");
  box.className = "card";
  box.innerHTML = "<h3>" + name + "</h3><p>" + price + " افغانی</p>";

  document.getElementById("list").appendChild(box);
}
</script>

</body>
</html>
