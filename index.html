<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Motor Market</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #ff3f00;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.container {
  padding: 10px;
}

.card {
  background: white;
  margin: 10px;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 0 10px #ccc;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.price {
  color: green;
  font-weight: bold;
}

button {
  background: #ff3f00;
  color: white;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 5px;
}
</style>

</head>

<body>

<header>
🚗 Motor Market افغانستان
</header>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/300">
<h3>کرولا 2010</h3>
<p class="price">500,000 افغانی</p>
<button>تماس</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300">
<h3>پرادو 2015</h3>
<p class="price">1,200,000 افغانی</p>
<button>تماس</button>
</div>

</div>

</body>
</html>
