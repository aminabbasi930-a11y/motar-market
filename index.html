<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Motor Market</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#f4f4f4;
}

header{
  background:#d32f2f;
  color:white;
  text-align:center;
  padding:15px;
  font-size:20px;
}

.container{
  padding:10px;
}

.card{
  background:white;
  margin:10px 0;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 8px #ccc;
}

img{
  width:100%;
  border-radius:10px;
}

.price{
  color:green;
  font-weight:bold;
}

input{
  width:95%;
  padding:10px;
  margin:5px;
}

button{
  width:95%;
  padding:10px;
  margin:5px;
  background:#d32f2f;
  color:white;
  border:none;
  border-radius:8px;
}

.delete{
  background:black;
  color:white;
  padding:5px;
  border-radius:5px;
  margin-top:5px;
}
</style>

</head>

<body>

<header>🚗 Motor Market</header>

<input id="search" placeholder="🔍 جستجو..." onkeyup="searchCar()">

<div class="container" id="list"></div>

<h3 style="padding:10px;">ثبت موتر</h3>

<input id="name" placeholder="نام موتر">
<input id="price" placeholder="قیمت">
<input id="image" placeholder="لینک عکس">

<button onclick="addCar()">ثبت</button>

<script>

let cars = JSON.parse(localStorage.getItem("cars")) || [];

window.onload = function(){
  cars.forEach(car => renderCar(car));
};

function addCar(){
  let car = {
    id: Date.now(),
    name: document.getElementById("name").value,
    price: document.getElementById("price").value,
    image: document.getElementById("image").value
  };

  cars.push(car);
  localStorage.setItem("cars", JSON.stringify(cars));

  renderCar(car);
}

function renderCar(car){
  let div = document.createElement("div");
  div.className = "card";
  div.id = car.id;

  div.innerHTML = `
    <img src="${car.image}">
    <h3>${car.name}</h3>
    <p class="price">${car.price} افغانی</p>
    <a href="https://wa.me/93700000000" target="_blank">📞 واتساپ</a>
    <br>
    <button class="delete" onclick="deleteCar(${car.id})">حذف</button>
  `;

  document.getElementById("list").appendChild(div);
}

function deleteCar(id){
  cars = cars.filter(car => car.id !== id);
  localStorage.setItem("cars", JSON.stringify(cars));
  document.getElementById(id).remove();
}

function searchCar(){
  let text = document.getElementById("search").value.toLowerCase();
  let items = document.getElementsByClassName("card");

  for(let i=0;i<items.length;i++){
    let content = items[i].innerText.toLowerCase();
    items[i].style.display = content.includes(text) ? "block" : "none";
  }
}

</script>

</body>
</html>
