<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Motor Market</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f1f3f6;
}

header {
  background: #d32f2f;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 22px;
}

/* search */
.search {
  padding: 10px;
  text-align: center;
}

.search input {
  width: 90%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

/* cards */
.container {
  display: grid;
  gap: 15px;
  padding: 10px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 10px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.02);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.price {
  color: green;
  font-weight: bold;
  font-size: 18px;
}

/* buttons */
.btn {
  display: block;
  text-align: center;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  text-decoration: none;
  color: white;
}

.buy {
  background: #d32f2f;
}

.whatsapp {
  background: #25D366;
}

/* footer */
footer {
  text-align: center;
  padding: 20px;
  background: #222;
  color: white;
  margin-top: 20px;
}
</style>

</head>

<body>

<header>
🚗 Motor Market افغانستان
</header>

<div class="search">
<input type="text" placeholder="جستجوی موتر...">
</div>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/400x200">
<h3>Toyota Corolla 2010</h3>
<p class="price">500,000 افغانی</p>

<a class="btn buy" href="#">جزئیات</a>
<a class="btn whatsapp" href="https://wa.me/93700000000">تماس واتساپ</a>
</div>

<div class="card">
<img src="https://via.placeholder.com/400x200">
<h3>Prado 2015</h3>
<p class="price">1,200,000 افغانی</p>

<a class="btn buy" href="#">جزئیات</a>
<a class="btn whatsapp" href="https://wa.me/93700000000">تماس واتساپ</a>
</div>

</div>

<footer>
© Motor Market | ساخته شده در افغانستان
</footer>

</body>
</html>
