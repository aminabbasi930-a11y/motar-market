<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Motor Market</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}
header {
  background: #d32f2f;
  color: white;
  padding: 20px;
  text-align: center;
}
.container {
  padding: 10px;
}
.card {
  background: white;
  padding: 10px;
  margin: 10px;
  border-radius: 10px;
}
img {
  width: 100%;
}
</style>
</head>

<body>

<header>🚗 Motor Market 🔥 جدید</header>

<div id="list"></div>

<input id="name" placeholder="نام موتر"><br>
<input id="price" placeholder="قیمت"><br>
<input id="image" placeholder="لینک عکس"><br>

<button onclick="addCar()">ثبت</button>

<script>

window.onload = function() {
  let data = JSON.parse(localStorage.getItem("cars")) || [];
  data.forEach(function(car){
    showCar(car);
  });
};

function addCar() {
  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;
  let image = document.getElementById("image").value;

  let car = {name:name, price:price, image:image};

  let data = JSON.parse(localStorage.getItem("cars")) || [];
  data.push(car);
  localStorage.setItem("cars", JSON.stringify(data));

  showCar(car);
}

function showCar(car) {
  let div = document.createElement("div");
  div.className = "card";

  div.innerHTML =
    "<img src='" + car.image + "'>" +
    "<h3>" + car.name + "</h3>" +
    "<p>" + car.price + " افغانی</p>";

  document.getElementById("list").appendChild(div);
}

</script>

</body>
</html>
