<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Motor Market</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f4f4;
}

header {
  background: #d32f2f;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 22px;
}

.container {
  display: grid;
  gap: 15px;
  padding: 10px;
}

.card {
  background: white;
  padding: 10px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #ccc;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.price {
  color: green;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #d32f2f;
  color: white;
  border-radius: 10px;
  margin-top: 5px;
}

input {
  width: 90%;
  padding: 10px;
  margin: 5px;
}
</style>
</head>

<body>

<header>
🚗 Motor Market
</header>

<div class="container" id="list">

<div class="card">
<h3>Corolla 2010</h3>
<p class="price">500,000 افغانی</p>
</div>

</div>

<h3 style="padding:10px;">➕ اضافه کردن موتر</h3>

<input id="name" placeholder="نام موتر">
<input id="price" placeholder="قیمت">
<input id="image" placeholder="لینک عکس">

<button onclick="addCar()">ثبت</button>

<script>
function addCar() {
  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;
  let image = document.getElementById("image").value;

  let box = document.createElement("div");
  box.className = "card";

  box.innerHTML = `
    <img src="${image}">
    <h3>${name}</h3>
    <p class="price">${price} افغانی</p>
    <button onclick="alert('تماس با فروشنده')">تماس</button>
  `;

  document.getElementById("list").appendChild(box);
}
</script>

</body>
</html>
