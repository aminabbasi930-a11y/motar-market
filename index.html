<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Motor Market</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #d32f2f;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 22px;
}

.container {
  display: grid;
  gap: 15px;
  padding: 10px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 10px;
  box-shadow: 0 2px 10px #ccc;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.price {
  color: green;
  font-weight: bold;
  font-size: 18px;
}

input {
  width: 90%;
  padding: 10px;
  margin: 5px;
}

button {
  width: 95%;
  padding: 10px;
  background: #d32f2f;
  color: white;
  border: none;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
🚗 Motor Market افغانستان
</header>

<div class="container" id="list">

<div class="card">
<img src="https://via.placeholder.com/400x200">
<h3>Corolla 2010</h3>
<p class="price">500,000 افغانی</p>
</div>

</div>

<h3 style="padding:10px;">➕ ثبت موتر</h3>

<input id="name" placeholder="نام موتر">
<input id="price" placeholder="قیمت">
<input id="image" placeholder="لینک عکس">

<button onclick="addCar()">ثبت</button>

<script>

// وقتی صفحه باز شد، موترهای قبلی را نشان بده
window.onload = function() {
  let data = JSON.parse(localStorage.getItem("cars")) || [];
  data.forEach(car => showCar(car));
};

function addCar() {
  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;
  let image = document.getElementById("image").value;

  let car = {name, price, image};

  let data = JSON.parse(localStorage.getItem("cars")) || [];
  data.push(car);
  localStorage.setItem("cars", JSON.stringify(data));

  showCar(car);
}

function showCar(car) {
  let box = document.createElement("div");
  box.className = "card";

  box.innerHTML = `
    <img src="${car.image}">
    <h3>${car.name}</h3>
    <p class="price">${car.price} افغانی</p>
  `;

  document.getElementById("list").appendChild(box);
}

</script></body>
</html>
